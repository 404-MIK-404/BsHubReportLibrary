

<H1>Тестовая демонстрация</H1>

<lib-bs-report></lib-bs-report>

<p-table lib-bs-report-table-directive [scrollable]="true" scrollHeight="400px"
         styleClass="p-datatable-gridlines mt-3" columnResizeMode="expand">
  <ng-template pTemplate="header">
    <tr>
      <th [pSortableColumn]="col.value" pFrozenColumn [frozen]="true"
          style="width:20%" *ngFor="let col of appModelTable.headers">
        {{ col.display }} <p-sortIcon [field]="col.value" />
      </th>
    </tr>
    <tr>
      <th *ngFor="let col of appModelTable.headers">
        <p-columnFilter type="text" [field]="col.value" [ariaLabel]="'Поиск ' + col.display"
                        [placeholder]="'Поиск по ' + col.display" />
      </th>
    </tr>
  </ng-template>
  <ng-template pTemplate="body" let-report>
    <tr>
      <td *ngFor="let col of appModelTable.headers">
        {{ report[col.value] }}
      </td>
    </tr>
  </ng-template>
</p-table>

</router-outlet>
