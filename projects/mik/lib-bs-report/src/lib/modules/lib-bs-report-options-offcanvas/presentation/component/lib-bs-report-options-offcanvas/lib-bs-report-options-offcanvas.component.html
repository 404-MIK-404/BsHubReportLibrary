
<div class="h-100 d-flex flex-column">
  <div class="offcanvas-header">
    <h4 class="offcanvas-title">Опция отчёта</h4>
    <button type="button" class="btn-close" aria-label="Закрыть"
            (click)="onClickCloseOffcanvas()">
    </button>
  </div>

  <div class="offcanvas-body p-0 flex-grow-1">
    <div class="overflow-y-auto">
      <p-tabView [scrollable]="true">
        <p-tabPanel header="Состав документа и критерии отбора">
          <p-table [value]="dataTableOptions[0].data" [scrollable]="true" scrollHeight="400px"
                   styleClass="p-datatable-gridlines" columnResizeMode="expand">
            <ng-template pTemplate="header">
              <tr>
                <th [pSortableColumn]="col.value" style="width:20%"
                    *ngFor="let col of dataTableOptions[0].headers">
                  {{ col.display }} <p-sortIcon [field]="col.value" />
                </th>
              </tr>
              <tr>
                <th *ngFor="let col of dataTableOptions[0].headers">
                  <p-columnFilter type="text" [field]="col.value" [ariaLabel]="'Поиск ' + col.display"
                                  [placeholder]="'Поиск по ' + col.display" />
                </th>
              </tr>
            </ng-template>
            <ng-template pTemplate="body" let-report>
              <tr>
                <td *ngFor="let col of dataTableOptions[0].headers">
                  {{ report[col.value] }}
                </td>
              </tr>
            </ng-template>
          </p-table>
        </p-tabPanel>
        <p-tabPanel header="Расширенные опций">
          <p-table [value]="dataTableOptions[1].data" [scrollable]="true" scrollHeight="400px"
                   columnResizeMode="expand" styleClass="p-datatable-gridlines">
            <ng-template pTemplate="header">
              <tr>
                <th [pSortableColumn]="col.value" style="width:20%" *ngFor="let col of dataTableOptions[1].headers">
                  <div style="display: flex; align-items: center">
                    <div class="flex-grow-1">{{ col.display }}</div>
                    <p-sortIcon [field]="col.value" />
                  </div>
                </th>
              </tr>
            </ng-template>
            <ng-template pTemplate="body" let-report>
              <tr>
                <td class="p-0 w-100" *ngFor="let col of dataTableOptions[1].headers">
                  <ng-container [ngSwitch]="col.value">
                    <div class="p-2" *ngSwitchCase="'name'">
                      {{report[col.value]}}
                    </div>
                    <ng-container *ngSwitchDefault [ngSwitch]="col.type">
                      <div *ngSwitchCase="'string'">
                        <input class="w-100 rounded-0 h-100" type="text" pInputText />
                      </div>
                      <div style="display: flex; justify-content: center;" *ngSwitchCase="'boolean'">
                        <p-checkbox [disabled]="!col.editable" [(ngModel)]="report[col.value]"
                                    [binary]="true" variant="filled" />
                      </div>
                      <div *ngSwitchCase="'number'">
                        <p-inputNumber class="w-100 h-100 rounded-0" mode="decimal" />
                      </div>
                      <div *ngSwitchCase="'list'">
                        <p-autoComplete/>
                      </div>
                    </ng-container>
                  </ng-container>
                </td>
              </tr>
            </ng-template>
          </p-table>
        </p-tabPanel>
      </p-tabView>
    </div>
  </div>
  <div class="p-3 d-flex flex-column">
    <div style="gap: 10px;" class="d-flex flex-row g-1">

      <button pButton style="font-size:medium"
              label="По умолчанию" class="btn btn-primary">
      </button>

      <button pButton label="Закрыть" (click)="onClickCloseOffcanvas()"
              class="btn btn-primary">
      </button>
    </div>
  </div>
</div>
