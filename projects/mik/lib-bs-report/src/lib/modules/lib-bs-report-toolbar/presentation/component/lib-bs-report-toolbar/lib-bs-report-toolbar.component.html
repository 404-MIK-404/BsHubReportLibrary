<div>
  <p-toolbar>
    <div class="row g-2 flex-grow-1">
      <div style="gap: 10px;" role="group" class="d-inline-flex flex-wrap me-2 w-100 col-md">
        <button pButton icon="pi pi-refresh" label="Обновить"  class="btn btn-primary"
                (click)="onClickRefresh()">
        </button>

        <button pButton label="Экспорт отчёта в Excel" (click)="onClickExportDataToExcel()"
                class="btn btn-primary">
        </button>

        <button pButton label="Опция отчёта" (click)="onClickOffcanvasOptions()"
                class="btn btn-primary">
        </button>
      </div>
      <div class="col-md-2">
        <div class="form-floating">
          <select class="form-select" id="floatingSelectGrid">
            <option selected disabled value="">Выберите дату</option>
            <option>1 сентября 2000 г.</option>
            <option>1 октября 2000 г.</option>
            <option>1 ноября 2000 г.</option>
            <option>1 декабря 2000 г.</option>
          </select>
          <label class="w-100" for="floatingSelectGrid">Просмотр отчётов по состоянию на:</label>
        </div>
      </div>
    </div>
  </p-toolbar>
</div>
